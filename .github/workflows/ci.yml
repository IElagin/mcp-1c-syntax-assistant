name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Образ собирается на 3.14; матрица проверяет, что код не завязан
        # на конкретную версию.
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        # Срез без Elasticsearch: поднимать кластер в CI ради 40 тестов дорого,
        # а 133 оставшихся покрывают парсер, карточку и контракт инструментов.
        run: pytest -m "not elasticsearch and not slow" -q

name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Образ собирается на 3.14; матрица проверяет, что код не завязан
        # на конкретную версию.
        python-version: ["3.12", "3.13"]

    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.1.0
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -f http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        # Кластер CI поднимает: тесты, которым нужен только он, готовят данные
        # сами. Не запускаются те, чьё требование в CI не воспроизвести:
        # настоящая поставка 1С, заполненный боевой индекс, живой сервер.
        run: pytest -m "not real_book and not real_index and not live_server" -q

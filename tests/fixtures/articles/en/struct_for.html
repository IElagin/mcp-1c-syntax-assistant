<html><head><meta http-equiv="Content-Type" content="text/html; charset=utf-8"></head><body><h1 class="V8SH_pagetitle">For Each</h1><div class="V8SH_title">For each</div><p class="Usual"><b>Syntax:<br></b>For Each &lt;Variable name 1&gt; In &lt;Variable name 2&gt; Do<br>&nbsp;&nbsp;&nbsp;&nbsp;// Operators<br>&nbsp;&nbsp;&nbsp;&nbsp;[Break;]<br>&nbsp;&nbsp;&nbsp;&nbsp;[Continue;]<br>EndDo;</p><p class="Usual"><b>Description:</b><br>The For Each operator traverses a collection.</p><hr><p class="Usual"><a href="v8help://topics/index.html">Methodological information</a></p></body></html>

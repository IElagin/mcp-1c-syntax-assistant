# Локальные настройки поверх docker-compose.yml (апстрим не трогаем).
# Compose подхватывает этот файл автоматически.
#
# Важно: файл .env на контейнеры не влияет — Dockerfile его не копирует,
# env_file не подключён. Настройки контейнера задаются только здесь.

# !override обязателен: списки ports Compose по умолчанию склеивает,
# и апстримная привязка к 0.0.0.0 осталась бы в дополнение к нашей.

services:
  elasticsearch:
    ports: !override
      # Только локальный доступ: xpack.security в апстриме выключен,
      # наружу такой ES выставлять нельзя.
      - "127.0.0.1:9200:9200"

  mcp-server:
    ports: !override
      - "127.0.0.1:8000:8000"
    environment:
      # true — переиндексировать при каждом старте, false — только если индекс пуст.
      - REINDEX_ON_STARTUP=false
    volumes:
      # Тесты в образ не копируются (Dockerfile берёт только src/),
      # монтируем, чтобы прогонять pytest внутри контейнера.
      - ./tests:/app/tests:ro
      - ./pytest.ini:/app/pytest.ini:ro
      # Замер качества поиска — по той же причине, иначе теряется при
      # пересоздании контейнера.
      - ./eval_search.py:/app/eval_search.py:ro

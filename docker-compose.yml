services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.0
    container_name: es-1c-helper
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      # Только localhost: xpack.security выключен, наружу такой ES выставлять нельзя.
      - "127.0.0.1:9200:9200"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5

  mcp-server:
    build: .
    container_name: mcp-1c-helper
    ports:
      # Только localhost. Как выставить сервис наружу — см. docs/DEPLOYMENT.md.
      - "127.0.0.1:8000:8000"
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - ./data/hbk:/app/data/hbk:ro
      # Путь совпадает с LOGS_DIRECTORY по умолчанию (data/logs от рабочего
      # каталога /app). При монтировании в /app/logs файлы оседали внутри
      # контейнера, а на хосте оставались пустышки.
      - ./data/logs:/app/data/logs
    environment:
      - ELASTICSEARCH_HOST=elasticsearch
      - ELASTICSEARCH_PORT=9200
      - LOG_LEVEL=INFO
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8000/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  elasticsearch_data:
